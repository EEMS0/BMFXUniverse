<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a0f">
  <title>EEMS merch · EEMS / BMFX</title>
  <meta name="description" content="Shop EEMS tees, hoodies and sweatpants. Choose your colour and size, and check out securely with Shopify.">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a0f; color: #f3eee6; font: 16px/1.6 system-ui, sans-serif; }
    a { color: inherit; } a:focus-visible, button:focus-visible { outline: 3px solid #9dfb58; outline-offset: 5px; }
    .shell { max-width: 1500px; margin: auto; padding: 0 clamp(20px, 4vw, 64px); }
    header { border-bottom: 1px solid #2c2736; }
    header .shell { min-height: 84px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .logo { display: block; width: 118px; height: auto; }
    .back { font-size: 14px; text-underline-offset: 5px; }
    .intro { padding-top: 64px; padding-bottom: 36px; }
    .eyebrow { color: #b99cf0; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 8px 0 16px; font-size: clamp(42px, 7vw, 80px); line-height: 1.05; letter-spacing: -.055em; }
    .intro p { max-width: 620px; color: #cdc6d9; }
    .catalog { background: #fff; color: #16131c; border-radius: 20px; padding: 32px 20px 0; min-height: 260px; }
    .status { padding: 24px; text-align: center; }
    .status[hidden] { display: none; }
    .retry { font: inherit; padding: 10px 24px; border-radius: 30px; cursor: pointer; background: #a07cff; color: #060509; border: 0; }
    footer { padding: 32px 0 48px; color: #a59eb4; font-size: 14px; }
    @media (max-width: 600px) { .intro { padding-top: 40px; } .catalog { padding: 24px 12px 0; } }
  </style>
  <noscript><style>#shop-status { display: none; }</style></noscript>
</head>
<body>
  <header><div class="shell"><a href="./" aria-label="EEMS home"><img class="logo" src="merch-wordmark.webp" alt="EEMS" width="118"></a><a class="back" href="./#art">Back to music &amp; artwork</a></div></header>
  <main class="shell">
    <div class="intro"><span class="eyebrow">From the EEMS world</span><h1>EEMS merch</h1><p>Tees, hoodies and sweatpants featuring EEMS artwork. Pick your colour and size below.</p><p>Secure checkout with Shopify. Shipping is calculated at checkout.</p></div>
    <section class="catalog" aria-label="Shop EEMS merchandise">
      <div id="shop-status" class="status" role="status"><p>Loading the merch…</p></div>
      <noscript><p class="status">Please enable JavaScript to choose sizes and shop the merch.</p></noscript>
      <div id="eems-merch-collection"></div>
    </section>
  </main>
  <footer class="shell"><p>EEMS / BMFX · Music. Visuals. Ideas. No Limits.</p><a href="./#hire-me">Get in touch</a></footer>
  <script>
    (function () {
      var status = document.getElementById('shop-status');
      var timer = setTimeout(showError, 25000);
      function showError() {
        status.hidden = false;
        status.innerHTML = '<p>The merch shop could not load. Please try again.</p><button class="retry" type="button">Try again</button>';
        status.querySelector('button').addEventListener('click', function () { location.reload(); });
      }
      function loaded() { clearTimeout(timer); status.hidden = true; }
      var script = document.createElement('script');
      script.src = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';
      script.async = true;
      script.onerror = function () { clearTimeout(timer); showError(); };
      script.onload = function () {
        // Public Storefront token supplied by Shopify's Buy Button embed, not an Admin API secret.
        var client = ShopifyBuy.buildClient({ domain: 'rfrjfs-u0.myshopify.com', storefrontAccessToken: 'faa6883c86b66b9dbe41fc98a9545412' });
        ShopifyBuy.UI.onReady(client).then(function (ui) {
          return ui.createComponent('collection', {
            id: '695390503244', node: document.getElementById('eems-merch-collection'), moneyFormat: '%C2%A3%7B%7Bamount%7D%7D',
            options: {
              product: {
                styles: {
                  product: { '@media (min-width: 601px)': { 'max-width': 'calc(33.333% - 20px)', 'margin-left': '20px', 'margin-bottom': '40px', width: 'calc(33.333% - 20px)' } },
                  button: { 'background-color': '#3f2275', ':hover': { 'background-color': '#563398' }, ':focus': { 'background-color': '#563398' }, 'border-radius': '24px' }
                }, text: { button: 'Add to cart' }
              },
              productSet: { events: { afterRender: loaded }, styles: { products: { '@media (min-width: 601px)': { 'margin-left': '-20px' } } } },
              modalProduct: { contents: { img: false, imgWithCarousel: true, button: false, buttonWithQuantity: true }, text: { button: 'Add to cart' } },
              cart: { popup: false, text: { total: 'Subtotal', button: 'Checkout' }, styles: { button: { 'background-color': '#3f2275', ':hover': { 'background-color': '#563398' }, ':focus': { 'background-color': '#563398' }, 'border-radius': '24px' } } },
              toggle: { styles: { toggle: { 'background-color': '#3f2275', ':hover': { 'background-color': '#563398' }, ':focus': { 'background-color': '#563398' } } } }
            }
          });
        }).catch(function () { clearTimeout(timer); showError(); });
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
